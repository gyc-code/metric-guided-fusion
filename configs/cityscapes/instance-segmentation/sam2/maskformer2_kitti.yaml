_BASE_: ../maskformer2_R50_bs16_90k.yaml
MODEL:
  BACKBONE:
    NAME: "ImageEncoder2"  #"ImageEncoder2"
  MASK_FORMER:
    FROZE_BACKBONE: False
  SWIN:
    EMBED_DIM: 128
    DEPTHS: [2, 2, 18, 2]
    NUM_HEADS: [4, 8, 16, 32]
    WINDOW_SIZE: 12
    APE: False
    DROP_PATH_RATE: 0.3
    PATCH_NORM: True
    PRETRAIN_IMG_SIZE: 384
  # WEIGHTS: "./pretrain/sam2.1_hiera_large.pt"
  WEIGHTS: "./pretrain/sam2.1_hiera_base_plus.pt"
  ####  debug
  # WEIGHTS:  "./output_vlm_link/sam2/cs_freeze_180k_sam2_vit_huge_180k/model_0179999.pth"

  PIXEL_MEAN: [123.675, 116.280, 103.530]
  PIXEL_STD: [58.395, 57.120, 57.375]
SOLVER:
  IMS_PER_BATCH: 3
  CHECKPOINT_PERIOD: 180000
  MAX_ITER: 180000
  STEPS: (160000, 173333)  

TEST:
  EVAL_PERIOD: 180000

INPUT:
  # MIN_SIZE_TRAIN: !!python/object/apply:eval ["[int(x * 0.1 * 1024) for x in range(5, 10)]"] #(5, 21)
  MIN_SIZE_TRAIN: !!python/object/apply:eval ["[int(x * 0.1 * 376) for x in range(11, 21)]"] #(5, 21) # kitti 376*1408

  MIN_SIZE_TRAIN_SAMPLING: "choice"
  MIN_SIZE_TEST: 384 #376
  MAX_SIZE_TRAIN: 1504 # kitti 376*4
  MAX_SIZE_TEST: 752 # kitti 376*2
  CROP:
    ENABLED: True
    TYPE: "absolute"
    SIZE:  (384, 672)  # kitti 376*1408, for model inference , size need to be size_divisibility(32),376 most close to 384 for divede/32, 672 most down close to 704 for divide/32

DATASETS:
  TRAIN: ('kitti360_instance_seg_train',) 
  TEST: ("kitti360_instance_seg_val",)
