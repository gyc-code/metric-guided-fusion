_BASE_: ../maskformer2_R50_bs16_90k.yaml
MODEL:
  BACKBONE:
    NAME: "ImageEncoder2Adapter"  #"ImageEncoder2"
  MASK_FORMER:
    FROZE_BACKBONE: False
  SWIN:
    EMBED_DIM: 128
    DEPTHS: [2, 2, 18, 2]
    NUM_HEADS: [4, 8, 16, 32]
    WINDOW_SIZE: 12
    APE: False
    DROP_PATH_RATE: 0.3
    PATCH_NORM: True
    PRETRAIN_IMG_SIZE: 384
  # WEIGHTS: "./pretrain/sam2.1_hiera_large.pt"
  WEIGHTS: "./pretrain/sam2.1_hiera_base_plus.pt"

  PIXEL_MEAN: [123.675, 116.280, 103.530]
  PIXEL_STD: [58.395, 57.120, 57.375]
SOLVER:
  IMS_PER_BATCH: 3
  CHECKPOINT_PERIOD: 180000
TEST:
  EVAL_PERIOD: 10

INPUT:
  CROP:
    ENABLED: True
    TYPE: "absolute"
    SIZE:  (1024, 1024)

DATASETS:
  TRAIN: ("cityscapes_fine_instance_seg_train",) #("cityscapes_fine_instance_seg_train",) #("urbansyn_instance_seg_train",)
  TEST: ("cityscapes_fine_instance_seg_val",)

ViT_USE_ADAPTER: True