_BASE_: ../maskformer2_R50_bs16_90k.yaml
MODEL:
  BACKBONE:
    NAME: "D2SwinTransformer"
  SWIN:
    EMBED_DIM: 192
    DEPTHS: [2, 2, 18, 2]
    NUM_HEADS: [6, 12, 24, 48]
    WINDOW_SIZE: 12
    APE: False
    DROP_PATH_RATE: 0.3
    PATCH_NORM: True
    PRETRAIN_IMG_SIZE: 384
  # WEIGHTS: "./pretrain/coco-mask2formwe-200queries-swinL-100epoch-model_final_e5f453.pkl"
  WEIGHTS: "./output/a_category_4UDA_swinL/kitti_urbansyn_human_cycle/model_final.pth"
  #"pretrain/coco-mask2formwe-200queries-swinL-100epoch-model_final_e5f453.pkl" # 
  ##  #"swin_large_patch4_window12_384_22k.pkl"
  PIXEL_MEAN: [123.675, 116.280, 103.530]
  PIXEL_STD: [58.395, 57.120, 57.375]
  MASK_FORMER:
    NUM_OBJECT_QUERIES: 200
SOLVER:
  IMS_PER_BATCH: 3
  CHECKPOINT_PERIOD: 40000
  WARMUP_FACTOR: 0.5
  WARMUP_ITERS: 1500
  BASE_LR: 0.0001
  MAX_ITER: 40000


INPUT:
  # MIN_SIZE_TRAIN: !!python/object/apply:eval ["[int(x * 0.1 * 1024) for x in range(5, 10)]"] #(5, 21)
  MIN_SIZE_TRAIN: !!python/object/apply:eval ["[int(x * 0.1 * 376) for x in range(11, 21)]"] #(5, 21) # kitti 376*1408

  MIN_SIZE_TRAIN_SAMPLING: "choice"
  MIN_SIZE_TEST: 384 #376
  MAX_SIZE_TRAIN: 1504 # kitti 376*4
  MAX_SIZE_TEST: 752 # kitti 376*2
  CROP:
    ENABLED: True
    TYPE: "absolute"
    # SIZE:  (512, 1024)  # 1024*1024 will cause shape mismatch in UDA
    # SIZE:  (376, 704)  # kitti 376*1408
    SIZE:  (384, 672)  # kitti 376*1408, for model inference , size need to be size_divisibility(32),376 most close to 384 for divede/32, 672 most down close to 704 for divide/32



DATASETS:
  TRAIN: ('uda_urbansyn_syn_real_human_cycle_instance_seg_train_eval_kitti360',) 
  TEST: ("kitti360_instance_seg_val",)

TEST:
  EVAL_PERIOD: 40000
OUTPUT_DIR: "./output/a-kitti/kitti"
