_BASE_: ../maskformer2_R50_bs16_90k.yaml
MODEL:
  BACKBONE:
    NAME: "D2SwinTransformer"
  SWIN:
    EMBED_DIM: 192
    DEPTHS: [2, 2, 18, 2]
    NUM_HEADS: [6, 12, 24, 48]
    WINDOW_SIZE: 12
    APE: False
    DROP_PATH_RATE: 0.3
    PATCH_NORM: True
    PRETRAIN_IMG_SIZE: 384
  WEIGHTS:   "./output/synthia_vehicle_1024_from_pre_coco_bs3/model_best.pth"
  # "./output/synthia_human_cycle_1024_from_pre_coco_bs3/model_best.pth"
  # "pretrain/coco-mask2formwe-200queries-swinL-100epoch-model_final_e5f453.pkl"
  ##  #"swin_large_patch4_window12_384_22k.pkl"
  PIXEL_MEAN: [123.675, 116.280, 103.530]
  PIXEL_STD: [58.395, 57.120, 57.375]
  MASK_FORMER:
    NUM_OBJECT_QUERIES: 200
SOLVER:
  IMS_PER_BATCH: 1
  CHECKPOINT_PERIOD: 100000
  BASE_LR: 0.0001 # 0.00005 todo
  MAX_ITER: 900000

DATASETS:
  TRAIN: ("uda_syn_real_vehicle_instance_seg_train",)
  # ("uda_syn_real_human_cycle_instance_seg_train",)
  # 
  # ("synthia_vehicle_instance_seg_train",) 
  #('urbansyn_human_cycle_instance_seg_train',) 
  #("urbansyn_vehicle_instance_seg_train",) 
  #("urbansyn_instance_seg_train",) 

  TEST: ("cityscapes_fine_instance_seg_val",)
TEST:
  EVAL_PERIOD: 200
OUTPUT_DIR: "./output/urbansyn_from_scratch"
